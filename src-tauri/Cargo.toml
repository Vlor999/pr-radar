[package]
name = "pr-radar"
version = "0.12.0"
description = "PR Radar: your open GitHub PRs, as a tree"
authors = ["Vlor999"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pr_radar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
# ponytail: vendored libdbus -> no libdbus-1-dev needed on Linux CI
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
# lancement à l'ouverture de session (LaunchAgent macOS, registre Windows, .desktop Linux)
tauri-plugin-autostart = "2"
# version web locale : serveur HTTP sur 127.0.0.1 (tokio, déjà le runtime de Tauri)
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
# signal : SIGTERM / SIGHUP (fermeture de session, arrêt du système) traités comme « Quitter » (crash.rs)
tokio = { version = "1", features = ["net", "signal"] }
getrandom = "0.3"
# sélecteurs du dossier et de l'export du journal (log.rs), ouverts depuis Rust
tauri-plugin-dialog = "2"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW : fichiers du journal jamais ouverts à travers un lien symbolique (log.rs)
# + heure de démarrage du système (sysctl KERN_BOOTTIME, crash.rs)
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# heure de démarrage du système (GetTickCount64, crash.rs)
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# thin LTO and parallel codegen: much shorter CI builds, binary slightly bigger
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
