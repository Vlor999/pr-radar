name: Release

# merge dev → main: release if the package.json version is not published yet
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.check.outputs.new }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          if gh release view "v$v" >/dev/null 2>&1; then echo new=false; else echo new=true; fi >> "$GITHUB_OUTPUT"

  release:
    needs: version
    # workflow_dispatch: manual rerun of a failed release, even if it already exists
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      # Developer ID signing + Apple notarization: macOS only, when the secrets exist
      HAS_APPLE: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config

      - run: npm ci

      # without these secrets, the macOS build keeps the ad hoc signature (tauri.conf.json)
      # (an empty APPLE_* variable would break ad hoc signing, hence the conditional export; <<EOF syntax is safe for multiline values)
      - name: Apple signing and notarization
        if: env.HAS_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          d="EOF_$(openssl rand -hex 16)"
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s<<%s\n%s\n%s\n' "$v" "$d" "${!v}" "$d" >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs in-app updates (updater plugin): private key kept as a repo secret
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'PR Radar v__VERSION__'
          releaseBody: |
            Téléchargement : https://vlor999.github.io/pr-radar/

            - macOS : app signée et notarisée par Apple, rien à contourner.
            - Windows (SmartScreen) : Informations complémentaires > Exécuter quand même.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Homebrew cask (Vlor999/homebrew-tap): updated only when the HOMEBREW_TAP_TOKEN secret exists
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    env:
      HAS_TAP: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Update cask
        if: env.HAS_TAP == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p '*_aarch64.dmg' -p '*_x64.dmg'
          arm=$(sha256sum *_aarch64.dmg | cut -d' ' -f1)
          intel=$(sha256sum *_x64.dmg | cut -d' ' -f1)
          gh auth setup-git
          gh repo clone Vlor999/homebrew-tap tap
          cd tap
          sed -i -E "s/version \"[^\"]+\"/version \"${TAG#v}\"/; s/arm:   \"[0-9a-f]+\"/arm:   \"$arm\"/; s/intel: \"[0-9a-f]+\"/intel: \"$intel\"/" Casks/pr-radar.rb
          git diff --quiet && exit 0
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -am "pr-radar ${TAG#v}"
          git push
