name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      # signature Developer ID + notarisation Apple : activées seulement si les secrets existent
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config

      - run: npm ci

      # sans ces secrets, la build macOS garde la signature ad hoc (tauri.conf.json)
      - name: Apple signing and notarization
        if: startsWith(matrix.platform, 'macos') && env.HAS_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signature des mises à jour intégrées (plugin updater) : clé privée gardée en secret du repo
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'PR Radar v__VERSION__'
          releaseBody: |
            Téléchargement : https://vlor999.github.io/pr-radar/

            - macOS : app signée et notarisée par Apple, rien à contourner.
            - Windows (SmartScreen) : Informations complémentaires > Exécuter quand même.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # cask Homebrew (Vlor999/homebrew-tap) : mis à jour seulement si le secret HOMEBREW_TAP_TOKEN existe
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    env:
      HAS_TAP: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Update cask
        if: env.HAS_TAP == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p '*_aarch64.dmg' -p '*_x64.dmg'
          arm=$(sha256sum *_aarch64.dmg | cut -d' ' -f1)
          intel=$(sha256sum *_x64.dmg | cut -d' ' -f1)
          gh auth setup-git
          gh repo clone Vlor999/homebrew-tap tap
          cd tap
          sed -i -E "s/version \"[^\"]+\"/version \"${TAG#v}\"/; s/arm:   \"[0-9a-f]+\"/arm:   \"$arm\"/; s/intel: \"[0-9a-f]+\"/intel: \"$intel\"/" Casks/pr-radar.rb
          git diff --quiet && exit 0
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -am "pr-radar ${TAG#v}"
          git push
