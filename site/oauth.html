<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>PR Radar: Slack</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Retour OAuth de Slack : relaie la query string à l'app (prradar://oauth?…), sans rien envoyer ailleurs. -->
<main>
<section>
  <div class="wrap">
    <p><img src="logo.svg" width="48" height="48" alt=""></p>
    <h1 id="title">Slack connected</h1>
    <p class="lead" id="text">PR Radar finishes signing in. You can close this tab.</p>
    <p class="muted" id="hint">Nothing happened?</p>
    <p class="actions"><a id="open" class="btn primary" href="#">Open PR Radar</a></p>
  </div>
</section>
</main>
<script>
(function () {
  var q = location.search.slice(1);
  var err = new URLSearchParams(q).get('error') || (/(^|&)code=/.test(q) ? '' : 'no code');
  var lang;
  try { lang = localStorage.getItem('lang'); } catch (e) {}
  if (lang !== 'fr' && lang !== 'en') lang = /^fr/i.test(navigator.language || '') ? 'fr' : 'en';
  var T = {
    en: {
      ok: 'Slack connected', okText: 'PR Radar finishes signing in. You can close this tab.',
      ko: 'Slack sign-in failed', koText: 'Slack returned: ', retry: '. Try again from the PR Radar settings.',
      hint: 'Nothing happened?', open: 'Open PR Radar'
    },
    fr: {
      ok: 'Slack connecté', okText: 'PR Radar termine la connexion. Vous pouvez fermer cet onglet.',
      ko: 'Échec de la connexion Slack', koText: 'Slack a répondu : ', retry: '. Réessayez depuis les réglages de PR Radar.',
      hint: 'Rien ne s\'est passé ?', open: 'Ouvrir PR Radar'
    }
  }[lang];
  document.documentElement.lang = lang;
  document.title = 'PR Radar: ' + (err ? T.ko : T.ok);
  document.getElementById('title').textContent = err ? T.ko : T.ok;
  document.getElementById('text').textContent = err ? T.koText + err + T.retry : T.okText;
  document.getElementById('hint').textContent = T.hint;
  var open = document.getElementById('open');
  open.textContent = T.open;
  // ni code ni erreur (page ouverte à la main) : rien à relayer
  if (!q) { open.parentNode.hidden = document.getElementById('hint').hidden = true; return; }
  // erreurs aussi relayées : l'app abandonne tout de suite au lieu d'attendre 5 min
  var link = 'prradar://oauth?' + q;
  open.href = link;
  history.replaceState(null, '', location.pathname);
  location.href = link;
})();
</script>
</body>
</html>
